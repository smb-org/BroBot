name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Staging-Stand auf Aktualität prüfen
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [[ "$current_sha" != "$EXPECTED_SHA" ]]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Staging-Lauf für $EXPECTED_SHA ist überholt; main steht inzwischen auf $current_sha."
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

      - if: steps.freshness.outputs.current == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - if: steps.freshness.outputs.current == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - if: steps.freshness.outputs.current == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - if: steps.freshness.outputs.current == 'true'
        run: pnpm install --frozen-lockfile
      # Vor dem Code-Deploy: Neuer Code erwartet das neue Schema, nicht
      # umgekehrt. Schlaegt eine Migration fehl, stoppt der Job hier vor dem
      # Code-Deploy und der bisherige Worker bleibt aktiv — D1 rollt aber nur
      # die fehlgeschlagene Migration selbst zurueck; bereits erfolgreich
      # angewandte Migrationen aus demselben Lauf bleiben im Schema.
      #
      # Nur Staging. Production migriert bewusst von Hand: Bei mehreren
      # ausstehenden Migrationen kann derselbe Effekt eintreten, sodass das
      # Schema zwischen zwei Staenden landet, ohne dass jemand hingesehen
      # hat. Eine vergessene Production-Migration faengt stattdessen der
      # Healthcheck nach dem Code-Deploy ab.
      - if: steps.freshness.outputs.current == 'true'
        name: Ausstehende Staging-Migrationen anwenden
        run: pnpm run migrate:staging:ci
      - if: steps.freshness.outputs.current == 'true'
        name: Staging code-only deployen
        run: pnpm run deploy:staging:ci-code-only
      - if: steps.freshness.outputs.current == 'true'
        name: Staging-Health prüfen
        env:
          DEPLOYMENT_ENV: staging
        run: node scripts/check-health.mjs "$DEPLOYMENT_ENV"

  production:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Production-Stand auf Aktualität prüfen
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [[ "$current_sha" != "$EXPECTED_SHA" ]]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Production-Lauf für $EXPECTED_SHA ist überholt; main steht inzwischen auf $current_sha."
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

      # Ohne `ref`: Bei workflow_dispatch checkt die Action ohnehin den
      # ausgelösten Stand aus, und der Job ist auf refs/heads/main begrenzt.
      # Ein explizites `ref` wäre reine Symmetrie zum Staging-Job und ließe
      # zugleich offen, ob hier fremder Code landen kann — er kann es nicht,
      # weil workflow_dispatch sich nicht aus einem Fork auslösen lässt.
      - if: steps.freshness.outputs.current == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - if: steps.freshness.outputs.current == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - if: steps.freshness.outputs.current == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - if: steps.freshness.outputs.current == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.freshness.outputs.current == 'true'
        name: Production code-only deployen
        run: pnpm run deploy:production:ci-code-only
      - if: steps.freshness.outputs.current == 'true'
        name: Production-Health prüfen
        env:
          DEPLOYMENT_ENV: production
        run: node scripts/check-health.mjs "$DEPLOYMENT_ENV"
