name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Lokale Testkonfiguration erzeugen
        run: |
          key() { openssl rand -base64 32 | tr '+/' '-_' | tr -d '='; }
          sed -e "s|^TWITCH_CLIENT_SECRET=.*|TWITCH_CLIENT_SECRET=local-twitch-client-secret|" \
              -e "s|^TWITCH_EVENTSUB_SECRET=.*|TWITCH_EVENTSUB_SECRET={\"active\":{\"id\":\"ci-eventsub-v1\",\"key\":\"$(key)\"},\"retired\":[]}|" \
              -e "s|^TOKEN_ENCRYPTION_KEYS=.*|TOKEN_ENCRYPTION_KEYS={\"active\":{\"id\":\"ci-encryption-v1\",\"key\":\"$(key)\"},\"retired\":[]}|" \
              -e "s|^SESSION_COOKIE_KEYS=.*|SESSION_COOKIE_KEYS={\"active\":{\"id\":\"ci-cookie-v1\",\"key\":\"$(key)\"},\"retired\":[]}|" \
              -e "s|^OVERLAY_TOKEN_PEPPER=.*|OVERLAY_TOKEN_PEPPER=$(key)|" \
              .dev.vars.example > .dev.vars
      - run: pnpm run check
      - name: Browser-Artefakte hochladen
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
