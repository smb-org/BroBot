sonar.projectKey=smb-org_BroBot
sonar.organization=smb-org

# Duplikate werden nur im Produktionscode gemessen.
#
# Tests dieses Projekts prüfen Sicherheitsbedingungen einzeln und mit
# Gegenprobe: Jede Zusicherung hat einen Test, der rot wird, wenn die
# geprüfte Bedingung im Code fällt. Das erzeugt zwangsläufig ähnlich
# gebaute Blöcke — Zustand einsetzen, Funktion rufen, Endzustand prüfen —
# die sich nur in der einen Variante unterscheiden, um die es geht.
#
# Diese Ähnlichkeit weiter zusammenzufassen würde genau das verstecken,
# worauf es ankommt: was der einzelne Test behauptet, muss an seiner
# Aufrufstelle lesbar bleiben. Der Maßstab für Testqualität ist hier die
# Mutationsprobe, nicht die Wiederholungsfreiheit.
#
# Für Produktionscode gilt die Schwelle unverändert.
sonar.cpd.exclusions=tests/**
