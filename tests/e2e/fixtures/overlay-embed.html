<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>BroBot overlay embed test</title></head>
  <body>
    <iframe id="overlay-frame" title="BroBot overlay" sandbox="allow-scripts"></iframe>
    <script>
      var params = new URLSearchParams(window.location.hash.slice(1));
      var token = params.get('token') || '';
      var origin = params.get('origin') || 'http://127.0.0.1:8787';
      document.getElementById('overlay-frame').src =
        origin + '/overlay.html#token=' + encodeURIComponent(token);
    </script>
  </body>
</html>
