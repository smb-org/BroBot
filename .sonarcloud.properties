# Explicit source/test scopes so Sonar's own duplication metric — which only
# covers sonar.sources — never runs over tests/. Test duplication is instead
# reported by the non-blocking jscpd CI step ("pnpm run dup:tests"), which is
# meant to catch it and isn't a required check.
sonar.sources=src,scripts
sonar.tests=tests
# The bilingual catalogs repeat the same keys for de and en by design and
# would otherwise dominate Sonar's duplication metric.
sonar.cpd.exclusions=src/**/*locale*.ts,src/dashboard/labels.ts,src/dashboard/module-labels.ts
